<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c3326">
<title>Anomaly (Goodminton)</title>
<meta name="description" content="Kas, stok bola dan jadwal main klub badminton Anomaly (Goodminton).">
<meta property="og:title" content="Anomaly (Goodminton)">
<meta property="og:description" content="Kas klub, stok bola, dan siapa yang belum bayar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230c3326'/%3E%3Cpath d='M20 14h24l-6 26H26z' fill='%23d4f25a'/%3E%3Cpath d='M26 14l3 26M38 14l-3 26M32 14v26' stroke='%230c3326' stroke-width='2'/%3E%3Ccircle cx='32' cy='46' r='7' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --court:#0c3326;--court2:#12503b;--lime:#d4f25a;--lime2:#b9dc35;
  --ink:#13241e;--muted:#66796f;--line:#e5ebe7;--bg:#f3f5f0;--card:#fff;
  --green:#15805a;--red:#c2412d;--redbg:#fdf0ed;--amber:#b7790b;--amberbg:#fdf5e2;--blue:#2a6496;--bluebg:#eaf2fa;
  --r:20px;--shadow:0 1px 2px #0c33260d,0 8px 28px #0c33260f;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.num,td.num,th.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:relative;overflow:hidden;color:#eef8f1;background:radial-gradient(120% 140% at 85% 0%,#1a6a4d 0%,var(--court) 55%,#082419 100%);padding:18px 0 92px}
.court{position:absolute;right:-60px;top:-30px;width:780px;max-width:120%;opacity:.13;pointer-events:none;transform:rotate(-8deg)}
.court *{fill:none;stroke:#fff;stroke-width:5}
.topbar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--lime);display:grid;place-items:center;box-shadow:0 6px 20px #0006;flex:none}
.logo svg{width:30px;height:30px}
.brand h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.brand p{margin:2px 0 0;font-size:12.5px;color:#a8c8b8;font-weight:500}
.ctrls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:#ffffff14;border:1px solid #ffffff22;border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;color:#cfe3d7;font-weight:700;font-size:12px;padding:6px 10px;border-radius:8px;transition:background .2s,color .2s}
.seg button.on{background:var(--lime);color:var(--court)}
.hbtn{background:#ffffff10;border:1px solid #ffffff2a;color:#eef8f1;border-radius:11px;padding:8px 13px;font-size:13px;font-weight:700;transition:background .2s,transform .15s}
.hbtn:hover{background:#ffffff22}
.hbtn:active{transform:scale(.97)}
.badge{font-size:10.5px;font-weight:800;letter-spacing:1.2px;background:var(--lime);color:var(--court);border-radius:20px;padding:5px 10px}

/* ---------- hero cards ---------- */
main{position:relative;margin-top:-68px;padding-bottom:70px}
.hero{display:grid;grid-template-columns:1.45fr 1fr 1fr;gap:14px;margin-bottom:26px}
.card{background:var(--card);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);border:1px solid #ffffffaa;position:relative;overflow:hidden}
.label{font-size:11.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.label .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #15805a22}
.big{font-size:clamp(30px,4.6vw,44px);font-weight:800;letter-spacing:-1.4px;line-height:1.05;margin:10px 0 4px}
.big.neg{color:var(--red)}
.sub{font-size:12.5px;color:var(--muted)}
.spark{position:absolute;right:18px;top:18px;width:150px;height:46px}
.spark path.l{fill:none;stroke:var(--green);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark path.a{fill:url(#sg);stroke:none}
.sparkcap{position:absolute;right:20px;top:66px;font-size:10.5px;color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:10px;background:#edf1ee;margin:16px 0 10px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,var(--green),#3fb47f);transition:width 1s var(--ease)}
.splits{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px}
.splits b{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px}
.splits .owed b{color:var(--red)}
.splits .r{text-align:right}
.splits small{color:var(--muted);font-weight:600}
.tubes{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tube{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;width:96px;height:16px;padding:3px;border-radius:7px;background:#eef2ef}
.tube s{border-radius:2px;background:#dfe6e1;text-decoration:none;transition:background .4s}
.tube s.f{background:var(--lime2)}
.warn{margin-top:10px;font-size:12px;font-weight:700;color:var(--amber);background:var(--amberbg);border-radius:9px;padding:6px 10px;display:inline-block}
.lg{display:flex;align-items:center;gap:16px;margin-top:12px}
.ring{width:78px;height:78px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:#edf1ee}.ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:15px}
.lg dl{margin:0;display:grid;gap:6px;font-size:12.5px}
.lg dt{color:var(--muted);font-weight:600}
.lg dd{margin:0;font-weight:800;font-size:15px}

/* ---------- sections ---------- */
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 12px}
h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px}
.sechead small{font-size:12.5px;color:var(--muted);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #d7e2da;background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:700;font-size:13px;transition:background .2s,border-color .2s,transform .15s,box-shadow .2s}
.btn:hover{background:#f2f8f3;border-color:#c5d8cb}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--court);border-color:var(--court);color:#fff}
.btn.primary:hover{background:var(--court2)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--court)}
.btn.lime:hover{background:var(--lime2)}
.btn.danger{color:var(--red);border-color:#f0d6d1}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.panel{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1000px}
th{background:#f6f8f5;text-align:left;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);padding:12px 10px;white-space:nowrap;font-weight:700}
th small{display:block;margin-top:2px;text-transform:none;letter-spacing:0;font-weight:500;font-size:10.5px}
td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:top}
tbody tr{transition:background .2s}
tbody tr:hover{background:#fafcf9}
td.num,th.num{text-align:right;white-space:nowrap}
td small{display:block;color:var(--muted);margin-top:3px;font-size:11.5px;line-height:1.4}
td:nth-child(2){min-width:170px}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.tag i{width:8px;height:8px;border-radius:50%;flex:none}
.tag.g i{background:var(--green)}.tag.c i{background:var(--blue)}.tag.s i{background:var(--amber)}
.in{color:var(--green);font-weight:700}.out{color:var(--red);font-weight:700}
.unp{color:var(--red);font-weight:700}
.paidtag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--green);background:#e7f5ee;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.plbtn{display:inline-flex;align-items:center;gap:6px}
.plbtn svg{width:14px;height:14px}
tfoot td{background:#f6f8f5;font-weight:800;border-top:1px solid var(--line)}
.empty{padding:44px 16px;text-align:center;color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);margin:12px 4px 0;line-height:1.6}
.more{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0 38px}

/* outstanding */
.owegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.owe{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:13px 14px;display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;color:var(--court);background:#e9f6c4}
.owe .who{flex:1;min-width:0}
.owe .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--redbg);color:#8c2f20;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip button{border:0;background:#fff;border-radius:12px;padding:1px 8px;font-size:11px;font-weight:800;color:var(--green);margin-right:-5px;transition:background .2s}
.chip button:hover{background:#e7f5ee}
.owe .amt{text-align:right;font-weight:800;color:var(--red);white-space:nowrap}
.owe .amt .btn{display:block;margin-top:6px}
.good{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:22px;text-align:center;color:var(--green);font-weight:700}

/* dialogs */
dialog{border:0;border-radius:22px;padding:24px;width:min(500px,94vw);max-height:92vh;box-shadow:0 30px 80px #0c332655;color:var(--ink)}
dialog::backdrop{background:#08241999;backdrop-filter:blur(3px)}
dialog[open]{animation:pop .22s var(--ease)}
dialog[open]::backdrop{animation:fade .22s ease}
dialog h2{margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
select{width:100%;border:1px solid #dbe4de;border-radius:12px;padding:11px 12px;background:#fff;font:inherit}
input,textarea{width:100%;border:1px solid #dbe4de;border-radius:12px;padding:11px 12px;background:#fff;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{outline:0;border-color:#3d9a72;box-shadow:0 0 0 4px #d4f0e2}
input[type=checkbox]{width:auto;margin-right:6px}
textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px}
.dlgactions{display:flex;gap:8px;margin-top:18px}
.dlgactions .primary{flex:1}
.plhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.plsum{font-size:13px}
.plbar{height:8px;border-radius:8px;background:#edf1ee;overflow:hidden;margin:8px 0 12px}
.plbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#3fb47f);transition:width .5s var(--ease)}
#plList{max-height:46vh;overflow:auto;margin:6px -6px 0;padding:0 6px}
.pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.pl .n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:#f0f4f1;color:var(--muted);flex:none;transition:background .3s,color .3s}
.pl.ok .n{background:#e7f5ee;color:var(--green)}
.pl .nm{flex:1;min-width:0}
.pl .nm small{color:var(--muted)}
.st{font-size:12px;font-weight:700;border-radius:9px;padding:5px 10px;border:1px solid transparent;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.st.ok{background:#e7f5ee;color:var(--green)}
.st.no{background:var(--redbg);color:var(--red)}
button.st.no{background:#fff;border-color:#f0d6d1}
button.st.no:hover{background:var(--redbg)}
button.st.ok:hover{background:#d8efe3}
.x{border:0;background:transparent;color:#a9b6af;font-size:15px;padding:4px 6px;border-radius:8px}
.x:hover{color:var(--red);background:var(--redbg)}
details summary{cursor:pointer;font-weight:700;font-size:13px}
.addp{display:flex;gap:8px;margin-top:10px}
.addp input{flex:1}
.receipt img{max-width:100%;border-radius:12px;display:block;margin:0 auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,24px);background:var(--court);color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);z-index:20;max-width:90vw;box-shadow:0 12px 30px #0c332640}
.toast.show{opacity:1;transform:translate(-50%,0)}
.setup{background:#fff7e3;border:1px solid #f0dca8;color:#7a5410;border-radius:16px;padding:14px 16px;font-size:13px;line-height:1.6;margin-bottom:16px}
.adminonly{display:none!important}
body.admin .adminonly{display:revert!important}
body.admin .actions.adminonly,body.admin .addp.adminonly{display:flex!important}
body.admin span.adminonly,body.admin button.adminonly{display:inline-block!important}

/* ---------- motion ---------- */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes flash{0%{background:#e9f8d2}100%{background:transparent}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.rise{animation:up .6s var(--ease) both;animation-delay:var(--d,0s)}
tr.anim,.owe.anim{animation:rowin .4s var(--ease) both;animation-delay:calc(var(--i,0)*28ms)}
.pl.flash{animation:flash 1s ease}
.brand .logo{animation:up .6s var(--ease) both}
.spark path.l{stroke-dasharray:var(--len);animation:draw 1.2s var(--ease) both .3s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:900px){.hero{grid-template-columns:1fr 1fr}.hero .money{grid-column:1/-1}}
@media (max-width:560px){
  .hero{grid-template-columns:1fr}.card{padding:18px}
  .spark{width:110px;height:36px}.sparkcap{display:none}
  .brand h1{font-size:18px}.top{padding-bottom:84px}
  .row2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <svg class="court" viewBox="0 0 1340 610" aria-hidden="true"><rect x="3" y="3" width="1334" height="604"/><path d="M3 49H1337M3 561H1337M79 3V607M1261 3V607M472 3V607M868 3V607M3 305H472M868 305H1337"/><path d="M670 0V610" style="stroke-dasharray:14 10;stroke-width:8"/></svg>
  <div class="wrap topbar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4h16l-4 16h-8z" fill="#0c3326"/><path d="M12 4l2 16M20 4l-2 16M16 4v16M9.5 10h13" stroke="#d4f25a" stroke-width="1.3" fill="none"/><circle cx="16" cy="24.5" r="5" fill="#fff" stroke="#0c3326" stroke-width="1.6"/></svg></div>
      <div><h1>Anomaly (Goodminton)</h1><p data-i="tagline"></p></div>
    </div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="id">ID</button><button type="button" data-lang="en">EN</button></div>
      <span class="badge adminonly">ADMIN</span>
      <button class="hbtn adminonly" id="openSettings" type="button" data-i="settings"></button>
      <button class="hbtn" id="authBtn" type="button"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="setup rise" id="setupMsg" hidden></div>

  <section class="hero">
    <div class="card money rise" style="--d:.05s">
      <div class="label"><span class="dot"></span><span data-i="cashLabel"></span></div>
      <svg class="spark" id="spark" viewBox="0 0 150 46" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15805a" stop-opacity=".22"/><stop offset="1" stop-color="#15805a" stop-opacity="0"/></linearGradient></defs></svg>
      <div class="sparkcap" id="sparkCap"></div>
      <div class="big num" id="cash">–</div>
      <div class="sub" data-i="cashSub"></div>
      <div class="bar"><i id="cashBar"></i></div>
      <div class="splits">
        <div class="owed"><small data-i="owedL"></small><b class="num" id="owed">–</b><small id="owedWho"></small></div>
        <div class="r"><small data-i="ifAllL"></small><b class="num" id="ifAll">–</b><small id="pctPaid"></small></div>
      </div>
    </div>
    <div class="card rise" style="--d:.12s">
      <div class="label" data-i="ballsLabel"></div>
      <div class="big num" id="balls">–</div>
      <div class="sub" id="ballsSub"></div>
      <div class="tubes" id="tubes"></div>
      <div id="ballsWarn"></div>
    </div>
    <div class="card rise" style="--d:.19s">
      <div class="label" id="lgLabel"></div>
      <div class="lg">
        <div class="ring"><svg viewBox="0 0 80 80"><circle class="bg" cx="40" cy="40" r="34"/><circle class="fg" id="ringFg" cx="40" cy="40" r="34" stroke-dasharray="213.6" stroke-dashoffset="213.6"/></svg><span id="ringTxt">–</span></div>
        <dl><div><dt data-i="lgPlayers"></dt><dd id="lgPlayers">–</dd></div><div><dt data-i="costPP"></dt><dd id="lgCost">–</dd></div></dl>
      </div>
      <div class="sub" id="lgPaid" style="margin-top:10px"></div>
    </div>
  </section>

  <div class="sechead rise" style="--d:.24s">
    <h2 data-i="activity"></h2>
    <div class="actions adminonly">
      <button class="btn primary" id="updBtn" type="button" data-i="updBtn"></button>
      <button class="btn lime" data-add="game" type="button" data-i="addGame"></button>
      <button class="btn" data-add="court" type="button" data-i="addCourt"></button>
      <button class="btn" data-add="shuttle" type="button" data-i="addShuttle"></button>
    </div>
  </div>
  <div class="panel rise" style="--d:.28s">
    <div class="tablewrap">
      <table>
        <thead><tr><th data-i="thDate"></th><th data-i="thAct"></th><th class="num" data-i="thPl"></th><th class="num"><span data-i="thIn"></span><small data-i="thInSub"></small></th><th class="num" data-i="thOut"></th><th class="num" data-i="thBal"></th><th class="num" data-i="thBalls"></th><th class="num"><span data-i="thCpp"></span><small data-i="thCppSub"></small></th><th data-i="thRc"></th><th class="adminonly"></th></tr></thead>
        <tbody id="rows"></tbody>
        <tfoot id="foot"></tfoot>
      </table>
    </div>
    <div class="empty" id="empty"></div>
  </div>
  <div class="note" id="costNote"></div>
  <div class="more"><button class="btn" type="button" id="moreBtn" hidden></button><button class="btn" type="button" id="resetWeeks" hidden data-i="reset"></button></div>

  <div class="sechead">
    <h2 data-i="outTitle"></h2><small id="outTotal"></small>
  </div>
  <div class="owegrid" id="outGrid"></div>
  <div class="good" id="outNone" hidden data-i="outNone"></div>
</main>

<dialog id="updDlg">
  <h2 data-i="updTitle"></h2>
  <div class="field"><label for="updText" data-i="updPaste"></label><textarea id="updText" style="min-height:170px" data-ph="updPh"></textarea></div>
  <div class="field"><label for="updGame" data-i="updGame"></label><select id="updGame"></select></div>
  <div class="field"><label><input id="updRm" type="checkbox"><span data-i="updRm"></span></label></div>
  <div class="hint" id="updState" style="font-size:12.5px"></div>
  <div class="dlgactions"><button class="btn primary" type="button" id="updGo" data-i="updGo"></button><button class="btn" type="button" id="updCancel" data-i="cancel"></button></div>
</dialog>

<dialog id="loginDlg">
  <h2 data-i="loginTitle"></h2>
  <form id="loginForm">

  const from=el._v??0;el._v=to;

async function loadAll(){
  const [e,s,at]=await Promise.all([
    sb.from('entries').select('*').order('date',{ascending:false}).order('created_at',{ascending:false}).limit(5000),
    sb.from('settings').select('*').eq('id',1).maybeSingle(),
    sb.from('attendees').select('*').order('pos',{ascending:true}).order('created_at',{ascending:true}).order('id',{ascending:true}).limit(20000)]);
  if(e.error||s.error||at.error){toast(t('loadErr'));$('empty').textContent=t('loadErr');return}
  items=e.data.map(fromRow);
  const byId=new Map(items.map(x=>[x.id,x]));
  for(const a of at.data){const x=byId.get(a.entry_id);if(x)x.attendees.push({id:a.id,name:cap(a.name),paid:a.paid,cash:a.cash,paid_on:a.paid_on})}
  if(s.data)settings={openingCash:Number(s.data.opening_cash),openingShuttles:Number(s.data.opening_shuttles),fee:Number(s.data.fee??30000)};
  loaded=true;render();
}

const MEMBER_COURT=100000; // prepaid member court, per court per Sunday
function courtCount(s){const m=String(s||'').match(/(?:Courts?|Lapangan)\s*([\d,\s\-&]+)/i);if(!m)return null;let n=0;
  for(const p of m[1].split(/[,&]/)){const r=p.trim().match(/^(\d+)\s*-\s*(\d+)$/);if(r)n+=+r[2]-+r[1]+1;else if(/^\d+$/.test(p.trim()))n++}return n||null}
function moneyIn(x){
  if(!hasList(x))return `<span class="in">${rp(x.collected)}</span>`;
  const n=x.attendees.length,p=paidN(x);
  return p===n?`<span class="in">${rp(p*settings.fee)}</span><span class="paidtag">${t('paidTag')}</span>`
    :`<span class="in">${rp(p*settings.fee)}</span> / ${rp(n*settings.fee)}<small class="unp">${t('unpaidN',n-p)}</small>`;
}
function spark(points,firstDate){
  const svg=$('spark');svg.querySelectorAll('path').forEach(p=>p.remove());
  if(points.length<2){$('sparkCap').textContent='';return}
  const W=150,H=46,mn=Math.min(...points),mx=Math.max(...points),rg=mx-mn||1;
  const xy=points.map((v,i)=>[i/(points.length-1)*W,H-4-(v-mn)/rg*(H-8)]);
  const d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const ns='http://www.w3.org/2000/svg';
  const a=document.createElementNS(ns,'path');a.setAttribute('class','a');a.setAttribute('d',d+` L${W} ${H} L0 ${H} Z`);svg.appendChild(a);
  const l=document.createElementNS(ns,'path');l.setAttribute('class','l');l.setAttribute('d',d);l.setAttribute('vector-effect','non-scaling-stroke');svg.appendChild(l);
  l.style.setProperty('--len',Math.ceil(l.getTotalLength()+2));
  $('sparkCap').textContent=t('sparkCap',shortDate(firstDate));
}
function render(){
  // totals, oldest first (bills before the game on the same day)
  const asc=[...items].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:((a.type==='game')-(b.type==='game')));
  let cash=settings.openingCash,balls=settings.openingShuttles;const bal=new Map(),line=[cash];
  for(const x of asc){
    if(x.type==='game'){cash+=gCollected(x)-x.extraCost;balls-=x.shuttles}
    else{cash-=x.amount;if(x.type==='shuttle')balls+=x.tubes*12}
    bal.set(x.id,cash);line.push(cash);
  }
  const owedPeople=new Set();let owedN=0;
  for(const x of items)for(const a of x.attendees)if(!a.paid){owedN++;owedPeople.add(a.name.trim().toLowerCase())}
  const owed=owedN*settings.fee,ifAll=cash+owed;
  const cashEl=$('cash');countTo(cashEl,cash,rp);cashEl.classList.toggle('neg',cash<0);
  countTo($('owed'),owed,rp);countTo($('ifAll'),ifAll,rp);
  $('owedWho').textContent=owed?t('people',owedPeople.size):t('allPaid');
  const pct=ifAll>0?Math.max(0,Math.min(100,cash/ifAll*100)):100;
  $('pctPaid').textContent=t('pctPaid',Math.floor(pct));
  requestAnimationFrame(()=>$('cashBar').style.width=pct+'%');
  spark(line,asc.length?asc[0].date:today());

  const ballsEl=$('balls');countTo(ballsEl,balls,v=>Math.round(v).toLocaleString(lang==='id'?'id-ID':'en-US'));ballsEl.classList.toggle('neg',balls<0);
  $('ballsSub').textContent=balls<0?t('negBalls'):t('ballsSub',Math.floor(balls/12),balls%12);
  const nt=Math.max(1,Math.min(8,Math.ceil(Math.max(0,balls)/12)));let tb='';
  for(let i=0;i<nt;i++){const f=Math.max(0,Math.min(12,balls-i*12));tb+='<div class="tube">'+Array.from({length:12},(_,j)=>`<s class="${j<f?'f':''}"></s>`).join('')+'</div>'}
  $('tubes').innerHTML=tb;
  $('ballsWarn').innerHTML=balls>=0&&balls<24?`<span class="warn">${t('lowStock')}</span>`:'';

  // shuttle price + cost per person
  const shut=items.filter(x=>x.type==='shuttle'),bq=shut.reduce((n,x)=>n+x.tubes*12,0),ballCost=bq?shut.reduce((n,x)=>n+x.amount,0)/bq:0;
  const costOf=x=>{const cc=courtCount(x.notes),mem=Math.max(0,(cc??(3+x.extraCourts))-x.extraCourts);return mem*MEMBER_COURT+x.extraCost+x.shuttles*ballCost};
  const courtOf=x=>{const cc=courtCount(x.notes),mem=Math.max(0,(cc??(3+x.extraCourts))-x.extraCourts);return mem*MEMBER_COURT+x.extraCost};

  // last game card
  const lg=items.filter(x=>x.type==='game').sort((a,b)=>a.date<b.date?1:-1)[0];
  if(lg){
    const n=gPlayers(lg),p=hasList(lg)?paidN(lg):n,fr=n?p/n:1;
    $('lgLabel').textContent=t('lastGame',prettyDate(lg.date));
    $('lgPlayers').textContent=n;$('lgCost').textContent=rp(costOf(lg)/(n||1));
    $('ringTxt').textContent=Math.round(fr*100)+'%';
    requestAnimationFrame(()=>$('ringFg').style.strokeDashoffset=(213.6*(1-fr)).toFixed(1));
    $('lgPaid').textContent=t('lgPaid',p,n);

/* ---------- read a pasted WhatsApp sign-up message ---------- */
const MONTHS={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,aug:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
function parseSignup(text){
  const lines=String(text||'').replace(/ /g,' ').split(/\r?\n/);
  const players=[];let stop=false,date=null,courts=null,head=[];
  for(const l of lines){
    if(/waiting\s*list/i.test(l))stop=true;
    const m=l.match(/^\s*(?:\[[^\]]*\]\s*[^:]*:\s*)?(\d{1,2})\s*[\).]\s*(.*)$/);
    if(!m){if(!players.length)head.push(l);continue}
    if(stop)continue;
    let n=m[2];const paid=/[✅✔☑]/.test(n);
    n=n.replace(/[✅✔☑️]/g,'').trim();
    if(n)players.push({name:cap(n.trim()),paid});
  }
  for(const l of head){
    if(!date){
      let d=l.match(/(\d{1,2})\s+([A-Za-z]{3,})\w*(?:\s+(\d{4}))?/);
      if(d&&MONTHS[d[2].slice(0,3).toLowerCase()]){const y=d[3]||new Date().getFullYear();date=`${y}-${pad(MONTHS[d[2].slice(0,3).toLowerCase()])}-${pad(d[1])}`}
      else{d=l.match(/\((\d{1,2})\/(\d{1,2})\)/);if(d)date=`${new Date().getFullYear()}-${pad(d[2])}-${pad(d[1])}`}
    }
    const c=l.match(/HU\s*no\.?\s*(?:[\d,\s&\-]|dan)+/i);
    if(c&&!courts){
      const txt=c[0].replace(/HU\s*no\.?/i,'').replace(/dan|&/gi,',');
      let nums=[];for(const part of txt.split(',')){const r=part.trim().match(/^(\d+)\s*-\s*(\d+)$/);if(r){for(let i=+r[1];i<=+r[2];i++)nums.push(i)}else if(/^\d+$/.test(part.trim()))nums.push(+part.trim())}
      if(nums.length)courts=nums;
    }
  }
  return {players,date,courts};
}
function readNames(text){
  const p=parseSignup(text);
  if(p.players.length)return p;
  const plain=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(name=>({name:cap(name),paid:false}));
  return {players:plain,date:null,courts:null};
}

}

async function applyList(x,r,removeMissing){

    else if(!toAdd.some(q=>q.name.toLowerCase()===k))toAdd.push(p);
  }
  const toRem=removeMissing?free.filter(a=>!a.paid):[];
  if(!toPay.length&&!toAdd.length&&!toRem.length){toast(t('nothingNew'));return false}

}

/* ---------- photo / receipt ---------- */
async function prepFile(file){
  if(file.type==='application/pdf'){if(file.size>3e6)throw Error(t('pdfBig'));return {blob:file,ext:'pdf',type:'application/pdf'}}
  if(!file.type.startsWith('image/'))throw Error(t('notImg'));
  const bmp=await createImageBitmap(file);
  const k=Math.min(1,1400/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.75));
  if(!blob)throw Error(t('cantRead'));
  return {blob,ext:'jpg',type:'image/jpeg'};
}

  e.preventDefault();
  const raw=id=>$(id)?$(id).value:'0';
  const v=id=>Number(raw(id));
  const date=$('f_date').value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast(t('pickDate'));return}
  let row={type:formType,date,notes:$('f_notes').value.trim()||null};
  let ok,newNames=null,newAllPaid=false;
  if(preview){toast(t('previewNoEdit'));return}
  if(formType==='game'){
    const names=$('f_names')?readNames($('f_names').value).players:[];
    const managed=editing&&hasList(editing);
    const base=['f_shuttles','f_extraCourts','f_extraCost'];
    if(managed){row={...row,shuttles_used:v('f_shuttles'),extra_courts:v('f_extraCourts'),extra_cost:v('f_extraCost')};
      ok=base.every(i=>raw(i)!=='')&&isInt(row.shuttles_used)&&isInt(row.extra_courts)&&isInt(row.extra_cost)}
    else if(names.length){const allPaid=$('f_allpaid').checked;newNames=names;newAllPaid=allPaid;
      row={...row,players:names.length,collected:(allPaid?names.length:names.filter(p=>p.paid).length)*settings.fee,shuttles_used:v('f_shuttles'),extra_courts:v('f_extraCourts'),extra_cost:v('f_extraCost')};
      ok=base.every(i=>raw(i)!=='')&&isInt(row.shuttles_used)&&isInt(row.extra_courts)&&isInt(row.extra_cost)}
    else{row={...row,players:v('f_players'),collected:v('f_collected'),shuttles_used:v('f_shuttles'),extra_courts:v('f_extraCourts'),extra_cost:v('f_extraCost')};
      ok=['f_players','f_collected',...base].every(i=>raw(i)!=='')&&isInt(row.players,1)&&isInt(row.collected)&&isInt(row.shuttles_used)&&isInt(row.extra_courts)&&isInt(row.extra_cost)}
  }else if(formType==='court'){
    row={...row,amount:v('f_amount')};ok=raw('f_amount')!==''&&isInt(row.amount);
  }else{
    row={...row,tubes:v('f_tubes'),amount:v('f_amount')};ok=raw('f_amount')!==''&&isInt(row.tubes,1)&&isInt(row.amount);
  }
  if(!ok){toast(t('fillWhole'));return}

  $('saveBtn').disabled=true;
  let uploaded=null;const oldPath=editing?editing.receipt:null;
  try{
    if(pending&&pending.blob){
      uploaded=`${crypto.randomUUID()}.${pending.ext}`;
      const up=await sb.storage.from('receipts').upload(uploaded,pending.blob,{contentType:pending.type,upsert:false});
      if(up.error)throw up.error;
      row.receipt_path=uploaded;
    }else if(pending===null)row.receipt_path=null;
    let res,newId=null;
    if(editing)res=await sb.from('entries').update(row).eq('id',editing.id);
    else{res=await sb.from('entries').insert(row).select('id').single();if(!res.error)newId=res.data.id}
    if(res.error)throw res.error;
    if(newId&&newNames){const ar=await sb.from('attendees').insert(newNames.map(n=>({entry_id:newId,name:n.name,paid:newAllPaid||n.paid,paid_on:(newAllPaid||n.paid)?date:null})));
      if(ar.error){await sb.from('entries').delete().eq('id',newId);throw ar.error}}
    if(oldPath&&(pending===null||(pending&&pending.blob)))await sb.storage.from('receipts').remove([oldPath]);
    $('formDlg').close();toast(editing?t('updated'):t('saved'));animRows=true;animFrom=0;await loadAll();
  }catch(err){
    if(uploaded)await sb.storage.from('receipts').remove([uploaded]);
    toast(t('saveErr')+(err.message||t('unknownErr'))+(isAdmin?'':t('notAdminHint')));
  }finally{$('saveBtn').disabled=false}
});

/* ---------- clicks ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.players){plId=d.players;renderPlayers();$('plDlg').showModal();return}
  if(d.pay&&isAdmin){setPaid([d.pay.split(':')],true);return}
  if(d.payperson&&isAdmin){setPaid(d.payperson.split(',').map(p=>p.split(':')),true);return}
  if(d.toggle&&isAdmin){const[g,a]=d.toggle.split(':');const x=items.find(i=>i.id===g),at=x&&x.attendees.find(z=>z.id===a);if(at)setPaid([[g,a]],!at.paid);return}
  if(d.rmp&&isAdmin){const[g,a]=d.rmp.split(':');const x=items.find(i=>i.id===g),at=x&&x.attendees.find(z=>z.id===a);
    if(!at||!confirm(t('confirmRm',at.name,prettyDate(x.date))))return;
    if(preview){x.attendees=x.attendees.filter(z=>z.id!==a);render();toast(t('previewNotSaved'));return}
    const r=await sb.from('attendees').delete().eq('id',a);if(r.error){toast(t('rmErr')+r.error.message);return}
    await loadAll();try{await syncGame(g)}catch(err){toast(err.message)}await loadAll();return}
  if((d.add||d.edit||d.del)&&preview){toast(t('previewNoEdit'));return}
  if(!configured)return;
  if(d.add&&isAdmin)return openForm(d.add);
  if(d.edit&&isAdmin){const x=items.find(i=>i.id===d.edit);if(x)openForm(x.type,x);return}
  if(d.del&&isAdmin){
    const x=items.find(i=>i.id===d.del);
    if(!x||!confirm(t('confirmDel',prettyDate(x.date))))return;
    const r=await sb.from('entries').delete().eq('id',x.id);
    if(r.error){toast(t('delErr')+r.error.message);return}
    if(x.receipt)await sb.storage.from('receipts').remove([x.receipt]);
    toast(t('deleted'));await loadAll();return}
  if(d.view){
    const p=d.view,url=photoUrl(p);
    $('viewBody').innerHTML=p.toLowerCase().endsWith('.pdf')?`<a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">${t('openPdf')}</a>`:`<img src="${esc(url)}" alt="">`;
    $('viewDlg').showModal();
  }
});
$('moreBtn').onclick=()=>{animFrom=$('rows').children.length;animRows=true;weeks+=4;render()};
$('resetWeeks').onclick=()=>{weeks=5;render();document.querySelector('.panel').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})};
$('closeView').onclick=()=>$('viewDlg').close();
document.querySelectorAll('dialog').forEach(dl=>dl.addEventListener('click',e=>{if(e.target!==dl)return;const r=dl.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dl.close()}));

/* ---------- settings (admin) ---------- */
$('openSettings').onclick=()=>{if(preview){toast(t('previewNoEdit'));return}$('s_cash').value=settings.openingCash;$('s_balls').value=settings.openingShuttles;$('s_fee').value=settings.fee;$('setDlg').showModal()};
$('closeSet').onclick=()=>$('setDlg').close();
$('setForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const c=Number($('s_cash').value),b=Number($('s_balls').value),f=Number($('s_fee').value);
  if($('s_cash').value===''||$('s_balls').value===''||$('s_fee').value===''||!isInt(c)||!isInt(b)||!isInt(f)){toast(t('wholeNums'));return}
  const r=await sb.from('settings').update({opening_cash:c,opening_shuttles:b,fee:f}).eq('id',1);
  if(r.error){toast(t('saveErr')+r.error.message);return}
  toast(t('settingsSaved'));$('setDlg').close();await loadAll();
});

/* ---------- start ---------- */
applyLang();
if(preview){$('setupMsg').hidden=false;loadSeed();render()}
else{
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){isAdmin=false;document.body.classList.remove('admin');$('authBtn').textContent=t('login');render()}});
  (async()=>{await refreshAdmin();await loadAll()})();
}
})();
</script>
</body>
</html>
